<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Icarus Lima — Folio</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #fafaf7; }
  * { box-sizing: border-box; }
  a { color: inherit; }
  .work-row { transition: background-color 0.15s ease; -webkit-tap-highlight-color: transparent; }
  .work-row:hover, .work-row:active { background-color: rgba(17, 17, 17, 0.04); }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="data.js"></script>
<script src="v2/case-assets.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="v2/swiss-shared.jsx"></script>
<script type="text/babel" src="v2/swiss-index.jsx"></script>
<script type="text/babel" src="v2/swiss-case.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "heroSlug": "the-iconic",
    "accent": "#e63b2e",
    "hmHome": "img/hello-molly/hm-1.png",
    "hmDresses": "img/hello-molly/hm-2.png",
    "hmSearch": "img/hello-molly/hm-3.png"
  }/*EDITMODE-END*/;

  function useHashRoute() {
    const [hash, setHash] = React.useState(() => window.location.hash || "#/");
    React.useEffect(() => {
      const h = () => { setHash(window.location.hash || "#/"); window.scrollTo(0, 0); };
      window.addEventListener("hashchange", h);
      return () => window.removeEventListener("hashchange", h);
    }, []);
    return hash;
  }

  // Slugs available — match data.js + case-assets.js
  const CASES = [
    { slug: "shippit", label: "Shippit" },
    { slug: "hello-molly", label: "Hello Molly" },
    { slug: "oovvuu", label: "Oovvuu" },
    { slug: "rockmelon", label: "Rockmelon" },
    { slug: "the-iconic", label: "The Iconic" },
    { slug: "skyfii", label: "Skyfii" },
    { slug: "news-corp", label: "News Corp" },
    { slug: "tigerspike", label: "Tigerspike" }
  ];

  function App() {
    const hash = useHashRoute();
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

    // Expose Hello Molly imagery for the case page (file-picker uploads only override locally)
    window.HM_IMAGES = { home: t.hmHome, dresses: t.hmDresses, search: t.hmSearch };

    // Apply accent live (mutate during render so the next descend sees it)
    if (window.SwissShared && t.accent) window.SwissShared.accent = t.accent;

    const m = hash.match(/^#\/work\/([a-z0-9-]+)/);
    let page;
    if (m) {
      const slug = m[1];
      // The hero/short choice is configurable via the tweak panel (heroSlug)
      const isHero = slug === t.heroSlug;
      page = isHero ? <SwissCaseHero slug={slug} key={slug} /> : <SwissCaseShort slug={slug} key={slug} />;
    } else {
      page = <SwissIndex />;
    }

    const onFile = (key) => (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const url = URL.createObjectURL(f);
      setTweak(key, url);
    };

    const isHM = m && m[1] === "hello-molly";

    return (
      <>
        {page}
        <TweaksPanel title="Folio Tweaks">
          <div className="twk-sect">Hero spread</div>
          <div style={{ fontSize: 11, color: "rgba(41,38,27,.6)", lineHeight: 1.5, marginBottom: 8 }}>
            Pick which engagement gets the full case-study layout. The others render condensed.
          </div>
          <TweakSelect
            label="Featured case"
            value={t.heroSlug}
            onChange={(v) => setTweak("heroSlug", v)}
            options={CASES.map((c) => ({ value: c.slug, label: c.label }))}
          />

          <div className="twk-sect">Accent colour</div>
          <TweakColor label="Accent" value={t.accent} onChange={(v) => setTweak("accent", v)} />
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 4 }}>
            {[
              ["#e63b2e", "Vermilion"],
              ["#1a4dcf", "Cobalt"],
              ["#0f7d3a", "Forest"],
              ["#111111", "Ink"],
              ["#c01a6a", "Magenta"]
            ].map(([hex, name]) => (
              <button
                key={hex}
                onClick={() => setTweak("accent", hex)}
                title={name}
                style={{
                  width: 22, height: 22, borderRadius: 999, padding: 0,
                  background: hex, border: t.accent === hex ? "2px solid #111" : "1px solid rgba(0,0,0,.2)",
                  cursor: "pointer"
                }}
              />
            ))}
          </div>

          <div className="twk-sect">Hello Molly imagery</div>
          <div style={{ fontSize: 11, color: "rgba(41,38,27,.6)", lineHeight: 1.5, marginBottom: 4 }}>
            {isHM ? "Live on this page." : <>Visit <a href="#/work/hello-molly" style={{ color: t.accent }}>the Hello Molly case</a> to see them.</>}
          </div>
          {[
            { k: "hmHome", label: "Home / hero", src: t.hmHome },
            { k: "hmDresses", label: "Dresses PLP", src: t.hmDresses },
            { k: "hmSearch", label: "Search overlay", src: t.hmSearch }
          ].map((row) => (
            <div key={row.k} className="twk-row">
              <div className="twk-lbl"><span>{row.label}</span></div>
              <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                <div style={{ width: 56, height: 38, border: ".5px solid rgba(0,0,0,.15)", borderRadius: 5, overflow: "hidden", background: "#fff", flexShrink: 0 }}>
                  {row.src && <img src={row.src} style={{ width: "100%", height: "100%", objectFit: "cover" }} />}
                </div>
                <label className="twk-btn secondary" style={{ display: "inline-flex", alignItems: "center", cursor: "pointer", flex: 1, justifyContent: "center" }}>
                  Upload…
                  <input type="file" accept="image/*" onChange={onFile(row.k)} style={{ display: "none" }} />
                </label>
              </div>
            </div>
          ))}

          <div className="twk-sect">Reset</div>
          <button className="twk-btn secondary" onClick={() => {
            setTweak("heroSlug", "the-iconic");
            setTweak("accent", "#e63b2e");
            setTweak("hmHome", "img/hello-molly/hm-1.png");
            setTweak("hmDresses", "img/hello-molly/hm-2.png");
            setTweak("hmSearch", "img/hello-molly/hm-3.png");
          }}>Restore defaults</button>
        </TweaksPanel>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
